name: Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.name }} · Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.timeout_minutes }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: core-no-torch
            python: "3.10"
            expects_torch: "false"
            timeout_minutes: 15
          - name: torch-cpu
            python: "3.12"
            expects_torch: "true"
            timeout_minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Create isolated virtual environment
        run: python -m venv .venv

      - name: Install project
        env:
          EXPECTS_TORCH: ${{ matrix.expects_torch }}
        run: |
          .venv/bin/python -m pip install --upgrade pip
          if [ "$EXPECTS_TORCH" = "true" ]; then
            .venv/bin/python -m pip install \
              --index-url https://download.pytorch.org/whl/cpu \
              "torch==2.5.1+cpu"
          fi
          .venv/bin/python -m pip install -e ".[dev]"
          .venv/bin/python -m pip check

      - name: Verify optional-dependency contract
        env:
          EXPECTS_TORCH: ${{ matrix.expects_torch }}
        run: |
          if [ "$EXPECTS_TORCH" = "true" ]; then
            .venv/bin/python -c "import torch; print('torch', torch.__version__)"
          else
            .venv/bin/python -c "import importlib.util; assert importlib.util.find_spec('torch') is None"
            .venv/bin/python -m dit.cli --help
          fi

      - name: Run tests
        run: .venv/bin/python -m pytest tests/ -q
