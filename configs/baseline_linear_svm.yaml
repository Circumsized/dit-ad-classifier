# Reproducible experiment config:
#   python -m dit.cli evaluate --config configs/baseline_linear_svm.yaml --synthetic
# Every key under `experiment:` must be a field of ExperimentConfig; the CLI
# refuses unknown keys. Dataset selection (--synthetic / --mat) and --out stay
# on the command line, so one config file describes the model, not the machine.

experiment:
  model: linear_svm
  task: binary
  split_strategy: stratified   # stratified | loso | site_stratified
  feature_view: summary        # summary | profile | FA/MD/...
  covariate_strategy: feature  # none | feature | residualize
  smooth_window: 5
  threshold_criterion: f1      # f1 | balanced | fixed
  n_splits: 5
  inner_splits: 3
  seed: 42
  n_jobs: 1
